<div data-testid="user-message" class="font-large py-0.5 grid grid-cols-1">
  <p class="whitespace-pre-wrap break-words">ダミーの質問です</p>
</div>
<div data-is-streaming="false" class="group relative pb-3">
  <div class="font-claude-response relative leading-[1.65rem]">
    <div class="grid grid-rows-[auto_auto] min-w-0">
      <div class="row-start-1 col-start-1 min-w-0">
        <button type="button" class="group/status flex items-center gap-2" aria-expanded="true">
          <span class="truncate font-base">ダミーの思考要約です。</span>
        </button>
        <div class="grid" style="grid-template-rows: 1fr;">
          <div class="overflow-hidden min-w-0">
            <div data-timeline-text="" class="px-2.5 text-text-300">
              <div class="standard-markdown grid-cols-1 grid gap-3">
                <p class="break-words whitespace-normal">ダミーの思考テキスト1行目です。</p>
                <p class="break-words whitespace-normal">ダミーの思考テキスト2行目です。</p>
              </div>
            </div>
            <div data-timeline-text="" class="pl-2.5 pt-0.5 text-text-300">完了</div>
          </div>
        </div>
      </div>
      <div class="row-start-2 col-start-1 min-w-0">
        <div class="standard-markdown grid-cols-1 grid gap-3">
          <p class="font-claude-response-body">ダミーの回答本文です。</p>
        </div>
      </div>
    </div>
  </div>
</div>
